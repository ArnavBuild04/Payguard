services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard
      POSTGRES_DB: payguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_pg_data:/var/lib/postgresql/data

  # Redpanda is a Kafka-API-compatible broker with no separate Zookeeper — one container instead
  # of Kafka's usual two, which matters on a machine already running everything through colima.
  # PLAN.md Phase B2 explicitly allows Kafka "or Redpanda".
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_pg_data:
  redpanda_data: